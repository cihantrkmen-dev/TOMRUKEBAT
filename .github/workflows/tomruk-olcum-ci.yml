name: TomrukOlcumAI CI/CD & YOLO-TFLite PDF APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-camera-apk:
    name: Dilimlemeli AI + Çoklu Referans + PDF Destekli APK Derle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter Projesini Hazırla ve Paketleri Ekle
        run: |
          if [ ! -f mobile_app/pubspec.yaml ]; then
            flutter create --org com.tomruk --project-name tomruk_olcum_ai mobile_app
          fi
          cd mobile_app
          flutter pub add image_picker image crypto shared_preferences tflite_flutter pdf printing

      - name: Uygulama Simgesi, TFLite Model ve Türkçe PDF Fontunu Hazırla
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install pillow
          python - << 'PYEOF'
          import os, shutil
          from PIL import Image

          # 1) Uygulama simgesi
          icon_candidates = [
              "app_icon.png", "app_icon.jpg", "app_icon.jpeg",
              "157433.jpg", "157433.png",
              "assets/app_icon.png", "assets/app_icon.jpg",
              "mobile_app/assets/app_icon.png", "mobile_app/assets/app_icon.jpg"
          ]
          src_icon = next((p for p in icon_candidates if os.path.exists(p)), None)
          if src_icon:
              im = Image.open(src_icon).convert("RGBA")
              side = max(im.size)
              square = Image.new("RGBA", (side, side), (255, 255, 255, 255))
              square.paste(im, ((side - im.width) // 2, (side - im.height) // 2), im)
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              res_dir = "mobile_app/android/app/src/main/res"
              for folder, px in sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  square.resize((px, px), Image.Resampling.LANCZOS).save(
                      os.path.join(out_dir, "ic_launcher.png"), format="PNG"
                  )
              print("Uygulama simgeleri güncellendi.")

          # 2) Açık kaynak YOLO TFLite modeli
          os.makedirs("mobile_app/assets/models", exist_ok=True)
          model_candidates = [
              "tomruk_model.tflite",
              "models/tomruk_model.tflite",
              "assets/models/tomruk_model.tflite",
              "mobile_app/assets/models/tomruk_model.tflite",
          ]
          src_model = next((p for p in model_candidates if os.path.exists(p)), None)
          dst_model = "mobile_app/assets/models/tomruk_model.tflite"
          if src_model and os.path.abspath(src_model) != os.path.abspath(dst_model):
              shutil.copy2(src_model, dst_model)
              print(f"TFLite model kopyalandı: {src_model}")
          elif not os.path.exists(dst_model):
              with open("mobile_app/assets/models/.keep", "w") as f:
                  f.write("place tomruk_model.tflite here\n")

          # 3) Çevrimdışı Türkçe PDF Fontu (DejaVuSans)
          os.makedirs("mobile_app/assets/fonts", exist_ok=True)
          font_src = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          font_bold_src = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          if os.path.exists(font_src):
              shutil.copy2(font_src, "mobile_app/assets/fonts/DejaVuSans.ttf")
          if os.path.exists(font_bold_src):
              shutil.copy2(font_bold_src, "mobile_app/assets/fonts/DejaVuSans-Bold.ttf")

          # 4) pubspec.yaml içine assets tanımlarını ekle
          pubspec_path = "mobile_app/pubspec.yaml"
          with open(pubspec_path, "r", encoding="utf-8") as f:
              content = f.read()
          if "assets/models/" not in content:
              content = content.replace(
                  "uses-material-design: true",
                  "uses-material-design: true\n  assets:\n    - assets/models/\n    - assets/fonts/"
              )
          elif "assets/fonts/" not in content:
              content = content.replace(
                  "- assets/models/",
                  "- assets/models/\n    - assets/fonts/"
              )
          with open(pubspec_path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: R8/ProGuard Aktifle, Test Et ve APK Üret
        working-directory: mobile_app
        run: |
          mkdir -p android/app
          grep -q "kotlin.jvm.target.validation.mode" android/gradle.properties 2>/dev/null || echo "kotlin.jvm.target.validation.mode=IGNORE" >> android/gradle.properties
          grep -q "org.tensorflow.lite" android/app/proguard-rules.pro 2>/dev/null || printf '\n-keep class org.tensorflow.lite.** { *; }\n-dontwarn org.tensorflow.lite.**\n' >> android/app/proguard-rules.pro

          if [ -f android/build.gradle.kts ]; then
            grep -q "lintVital" android/build.gradle.kts || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            grep -q "lintVital" android/build.gradle || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' android/app/build.gradle
          fi

          flutter pub get
          flutter test
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: APK Çıktısını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tomruk-olcum-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
