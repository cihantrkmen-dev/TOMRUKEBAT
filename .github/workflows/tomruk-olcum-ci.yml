name: TomrukOlcumAI CI/CD & YOLO-TFLite PDF APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-camera-apk:
    name: Dilimlemeli AI + Çoklu Referans + PDF Destekli APK Derle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter Projesini Hazırla ve Paketleri Ekle
        run: |
          if [ ! -f mobile_app/pubspec.yaml ]; then
            flutter create --org com.tomruk --project-name tomruk_olcum_ai mobile_app
          fi
          cd mobile_app
          flutter pub add image_picker image crypto shared_preferences tflite_flutter pdf printing

      - name: Uygulama Simgesi, TFLite Model ve Türkçe PDF Fontunu Hazırla
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install pillow
          python - << 'PYEOF'
          import os, shutil
          from PIL import Image

          # 1) Uygulama simgesi
          icon_candidates = [
              "app_icon.png", "app_icon.jpg", "app_icon.jpeg",
              "157433.jpg", "157433.png",
              "assets/app_icon.png", "assets/app_icon.jpg",
              "mobile_app/assets/app_icon.png", "mobile_app/assets/app_icon.jpg"
          ]
          src_icon = next((p for p in icon_candidates if os.path.exists(p)), None)
          if src_icon:
              im = Image.open(src_icon).convert("RGBA")
              side = max(im.size)
              square = Image.new("RGBA", (side, side), (255, 255, 255, 255))
              square.paste(im, ((side - im.width) // 2, (side - im.height) // 2), im)
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              res_dir = "mobile_app/android/app/src/main/res"
              for folder, px in sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  square.resize((px, px), Image.Resampling.LANCZOS).save(
                      os.path.join(out_dir, "ic_launcher.png"), format="PNG"
                  )
              print("Uygulama simgeleri güncellendi.")

          # 2) Açık kaynak YOLO TFLite modeli
          os.makedirs("mobile_app/assets/models", exist_ok=True)
          model_candidates = [
              "tomruk_model.tflite",
              "models/tomruk_model.tflite",
              "assets/models/tomruk_model.tflite",
              "mobile_app/assets/models/tomruk_model.tflite",
          ]
          src_model = next((p for p in model_candidates if os.path.exists(p)), None)
          dst_model = "mobile_app/assets/models/tomruk_model.tflite"
          if src_model and os.path.abspath(src_model) != os.path.abspath(dst_model):
              shutil.copy2(src_model, dst_model)
              print(f"TFLite model kopyalandı: {src_model}")
          elif not os.path.exists(dst_model):
              with open("mobile_app/assets/models/.keep", "w") as f:
                  f.write("place tomruk_model.tflite here\n")

          # 3) Çevrimdışı Türkçe PDF Fontu (DejaVuSans)
          os.makedirs("mobile_app/assets/fonts", exist_ok=True)
          font_src = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          font_bold_src = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          if os.path.exists(font_src):
              shutil.copy2(font_src, "mobile_app/assets/fonts/DejaVuSans.ttf")
          if os.path.exists(font_bold_src):
              shutil.copy2(font_bold_src, "mobile_app/assets/fonts/DejaVuSans-Bold.ttf")

          # 4) pubspec.yaml içine assets tanımlarını ekle
          pubspec_path = "mobile_app/pubspec.yaml"
          with open(pubspec_path, "r", encoding="utf-8") as f:
              content = f.read()
          if "assets/models/" not in content:
              content = content.replace(
                  "uses-material-design: true",
                  "uses-material-design: true\n  assets:\n    - assets/models/\n    - assets/fonts/"
              )
          elif "assets/fonts/" not in content:
              content = content.replace(
                  "- assets/models/",
                  "- assets/models/\n    - assets/fonts/"
              )
          with open(pubspec_path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Uygulama Kodunu Yaz (Tiling + 1-5 Ref IDW + Parçalı İstif + PDF)
        run: |
          cat << 'EOF' > mobile_app/lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'dart:typed_data';
          import 'package:crypto/crypto.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:image/image.dart' as img;
          import 'package:image_picker/image_picker.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:tflite_flutter/tflite_flutter.dart';

          void main() {
            runApp(const TomrukOlcumApp());
          }

          // ====================================================================
          // 1. ÇEVRİMDIŞI LİSANSLAMA VE GÜVENLİK SERVİSİ (XOR + SHA-256)
          // ====================================================================
          class LisansServisi {
            static const String gelistiriciMail = 'cihantrkmen@gmail.com';
            static const String _prefTalepKey = 'tomruk_talep_kodu_v1';
            static const String _prefLisansKey = 'tomruk_lisans_anahtari_v1';

            static const int _xorKey = 0x5A;
            static const List<int> _gizliTuzBytes = [
              21, 29, 23, 119, 30, 20, 0, 119, 104, 106, 104, 108, 119,
              25, 19, 18, 27, 20, 119, 14, 15, 8, 17, 23, 31, 20, 119,
              9, 27, 22, 14, 121, 99, 107
            ];

            static const String _yoneticiSifreHash =
                'fcf9ad9079a8319030d71827281b94f8513c610da250f0de32aa4302e8e3bb5f';

            static String _tuzuCoz() {
              return String.fromCharCodes(_gizliTuzBytes.map((b) => b ^ _xorKey));
            }

            static bool yoneticiSifresiDogrula(String girilenSifre) {
              final digest = sha256.convert(utf8.encode(girilenSifre.trim())).toString();
              return digest == _yoneticiSifreHash;
            }

            static String lisansAnahtariUret(String talepKodu) {
              final temizTalep = talepKodu.trim().toUpperCase();
              final girdi = '$temizTalep|${_tuzuCoz()}';
              final hashHex = sha256.convert(utf8.encode(girdi)).toString().toUpperCase();
              return 'OGM-${hashHex.substring(0, 4)}-${hashHex.substring(4, 8)}';
            }

            static Future<String> talepKoduGetirVeyaUret() async {
              final prefs = await SharedPreferences.getInstance();
              String? mevcut = prefs.getString(_prefTalepKey);
              if (mevcut != null && mevcut.startsWith('TALEP-')) {
                return mevcut;
              }
              const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
              final rnd = Random.secure();
              final kod = List.generate(4, (_) => chars[rnd.nextInt(chars.length)]).join();
              final yeniTalep = 'TALEP-$kod';
              await prefs.setString(_prefTalepKey, yeniTalep);
              return yeniTalep;
            }

            static Future<bool> lisansGecerliMi() async {
              final prefs = await SharedPreferences.getInstance();
              final talep = await talepKoduGetirVeyaUret();
              final kayitliLisans = prefs.getString(_prefLisansKey);
              if (kayitliLisans == null) return false;
              return kayitliLisans.trim().toUpperCase() == lisansAnahtariUret(talep);
            }

            static Future<bool> lisansDogrulaVeKaydet(String girilenAnahtar) async {
              final talep = await talepKoduGetirVeyaUret();
              final beklenen = lisansAnahtariUret(talep);
              if (girilenAnahtar.trim().toUpperCase() == beklenen) {
                final prefs = await SharedPreferences.getInstance();
                await prefs.setString(_prefLisansKey, beklenen);
                return true;
              }
              return false;
            }

            static void yoneticiPaneliGoster(BuildContext context, {String varsayilanTalep = ''}) {
              final sifreCtrl = TextEditingController();
              final talepCtrl = TextEditingController(text: varsayilanTalep);
              String? uretilenAnahtar;
              bool yetkili = false;
              String? sifreHata;

              showDialog(
                context: context,
                builder: (ctx) {
                  return StatefulBuilder(
                    builder: (ctx, setModalState) {
                      return AlertDialog(
                        title: const Text('Yönetici Lisans Paneli'),
                        content: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            if (!yetkili) ...[
                              TextField(
                                controller: sifreCtrl,
                                obscureText: true,
                                decoration: InputDecoration(
                                  labelText: 'Yönetici Şifresi',
                                  errorText: sifreHata,
                                  border: const OutlineInputBorder(),
                                ),
                              ),
                            ] else ...[
                              TextField(
                                controller: talepCtrl,
                                textCapitalization: TextCapitalization.characters,
                                decoration: const InputDecoration(
                                  labelText: 'Kullanıcı Talep Kodu (TALEP-XXXX)',
                                  border: OutlineInputBorder(),
                                ),
                              ),
                              const SizedBox(height: 12),
                              FilledButton(
                                onPressed: () {
                                  if (talepCtrl.text.trim().isEmpty) return;
                                  setModalState(() {
                                    uretilenAnahtar = lisansAnahtariUret(talepCtrl.text);
                                  });
                                },
                                child: const Text('Lisans Anahtarı Üret'),
                              ),
                              if (uretilenAnahtar != null) ...[
                                const SizedBox(height: 12),
                                SelectableText(
                                  uretilenAnahtar!,
                                  style: const TextStyle(
                                    fontSize: 18,
                                    fontWeight: FontWeight.bold,
                                    color: Colors.green,
                                  ),
                                ),
                                TextButton.icon(
                                  icon: const Icon(Icons.copy),
                                  label: const Text('Kopyala'),
                                  onPressed: () {
                                    Clipboard.setData(ClipboardData(text: uretilenAnahtar!));
                                    ScaffoldMessenger.of(context).showSnackBar(
                                      const SnackBar(content: Text('Lisans anahtarı kopyalandı.')),
                                    );
                                  },
                                ),
                              ],
                            ],
                          ],
                        ),
                        actions: [
                          TextButton(
                            onPressed: () => Navigator.of(ctx).pop(),
                            child: const Text('Kapat'),
                          ),
                          if (!yetkili)
                            FilledButton(
                              onPressed: () {
                                if (yoneticiSifresiDogrula(sifreCtrl.text)) {
                                  setModalState(() {
                                    yetkili = true;
                                    sifreHata = null;
                                  });
                                } else {
                                  setModalState(() => sifreHata = 'Hatalı yönetici şifresi');
                                }
                              },
                              child: const Text('Giriş'),
                            ),
                        ],
                      );
                    },
                  );
                },
              );
            }
          }

          // ====================================================================
          // 2. ÇEVRİMDIŞI YOLO-TFLITE + OTOMATİK DİLİMLEME (TILING / SAHI)
          // ====================================================================
          class _AdayDaire {
            final double x; // 0..1 global genişlik
            final double y; // 0..1 global yükseklik
            double r;       // global genişliğe göre yarıçap
            final double skor;
            _AdayDaire(this.x, this.y, this.r, this.skor);
          }

          class YoloTfliteServisi {
            Interpreter? _interpreter;
            bool get aktif => _interpreter != null;

            Future<bool> yukle() async {
              try {
                _interpreter = await Interpreter.fromAsset('assets/models/tomruk_model.tflite');
                return true;
              } catch (_) {
                _interpreter = null;
                return false;
              }
            }

            void kapat() {
              _interpreter?.close();
              _interpreter = null;
            }

            List<_AdayDaire> _tekKareTespit(img.Image kare, {double confEsik = 0.25}) {
              if (_interpreter == null) return [];
              final inputShape = _interpreter!.getInputTensor(0).shape;
              final int inH = inputShape.length >= 3 ? inputShape[1] : 640;
              final int inW = inputShape.length >= 3 ? inputShape[2] : 640;

              final img.Image resized = img.copyResize(kare, width: inW, height: inH);
              final input = List.generate(
                1,
                (_) => List.generate(
                  inH,
                  (y) => List.generate(
                    inW,
                    (x) {
                      final p = resized.getPixel(x, y);
                      return [p.r / 255.0, p.g / 255.0, p.b / 255.0];
                    },
                  ),
                ),
              );

              final outShape = _interpreter!.getOutputTensor(0).shape;
              final int dim1 = outShape[1];
              final int dim2 = outShape[2];
              final output = List.generate(
                1,
                (_) => List.generate(dim1, (_) => List<double>.filled(dim2, 0.0)),
              );

              _interpreter!.run(input, output);

              final List<_AdayDaire> adaylar = [];
              final bool kanalOnce = dim1 < dim2;
              final int kutuSayisi = kanalOnce ? dim2 : dim1;
              final int ozellikSayisi = kanalOnce ? dim1 : dim2;

              for (int i = 0; i < kutuSayisi; i++) {
                double maxConf = 0.0;
                for (int c = 4; c < ozellikSayisi; c++) {
                  final double val = kanalOnce ? output[0][c][i] : output[0][i][c];
                  if (val > maxConf) maxConf = val;
                }
                if (maxConf < confEsik) continue;

                double cx = kanalOnce ? output[0][0][i] : output[0][i][0];
                double cy = kanalOnce ? output[0][1][i] : output[0][i][1];
                double bw = kanalOnce ? output[0][2][i] : output[0][i][2];
                double bh = kanalOnce ? output[0][3][i] : output[0][i][3];

                if (cx > 2.0 || cy > 2.0 || bw > 2.0) {
                  cx /= inW;
                  cy /= inH;
                  bw /= inW;
                  bh /= inH;
                }

                final double rNorm = (bw + bh) / 4.0;
                if (rNorm > 0.005 && rNorm < 0.35) {
                  adaylar.add(_AdayDaire(cx.clamp(0.0, 1.0), cy.clamp(0.0, 1.0), rNorm, maxConf));
                }
              }
              return adaylar;
            }

            /// Uzun istifler için %20 örtüşmeli otomatik yatay dilimleme + tam kare birleştirme
            List<_AdayDaire> dilimliTespitEt(img.Image orijinal, {double confEsik = 0.25}) {
              final List<_AdayDaire> tumu = [];
              // 1) Tam kare taraması (büyük tomrukları yakalar)
              tumu.addAll(_tekKareTespit(orijinal, confEsik: confEsik));

              // 2) Geniş/yüksek çözünürlüklü karelerde %20 örtüşmeli 2 veya 3 dilim
              if (orijinal.width >= 900) {
                final int dilimSayisi = (orijinal.width / max(1, orijinal.height)) > 1.45 ? 3 : 2;
                final double ortusme = 0.20;
                final double dilimGenislikOran = 1.0 / (dilimSayisi - (dilimSayisi - 1) * ortusme);
                final int dilimW = (orijinal.width * dilimGenislikOran).round().clamp(1, orijinal.width);
                final int adimX = dilimSayisi > 1
                    ? ((orijinal.width - dilimW) / (dilimSayisi - 1)).round()
                    : 0;

                for (int d = 0; d < dilimSayisi; d++) {
                  final int startX = (d * adimX).clamp(0, max(0, orijinal.width - dilimW));
                  final img.Image parca = img.copyCrop(
                    orijinal,
                    x: startX,
                    y: 0,
                    width: dilimW,
                    height: orijinal.height,
                  );
                  final parcaAdaylar = _tekKareTespit(parca, confEsik: confEsik);
                  for (final a in parcaAdaylar) {
                    final gx = (startX + a.x * dilimW) / orijinal.width;
                    final gy = a.y;
                    final gr = (a.r * dilimW) / orijinal.width;
                    tumu.add(_AdayDaire(gx.clamp(0.0, 1.0), gy.clamp(0.0, 1.0), gr, a.skor));
                  }
                }
              }
              return tumu;
            }
          }

          // ====================================================================
          // 3. ÇEVRİMDIŞI PDF ÇAP-ADET DÖKÜM SERVİSİ
          // ====================================================================
          class PdfRaporServisi {
            static Future<void> raporOlusturVePaylas({
              required List<int> tamCaplarCm,
              required double emvalBoyuM,
              required int parcaSayisi,
            }) async {
              pw.Font? regularFont;
              pw.Font? boldFont;
              try {
                final regData = await rootBundle.load('assets/fonts/DejaVuSans.ttf');
                regularFont = pw.Font.ttf(regData);
                final boldData = await rootBundle.load('assets/fonts/DejaVuSans-Bold.ttf');
                boldFont = pw.Font.ttf(boldData);
              } catch (_) {
                regularFont = pw.Font.helvetica();
                boldFont = pw.Font.helveticaBold();
              }

              // Çaplara göre grupla ve küçükten büyüğe sırala
              final Map<int, int> capAdetMap = {};
              for (final c in tamCaplarCm) {
                capAdetMap[c] = (capAdetMap[c] ?? 0) + 1;
              }
              final sortedCaplar = capAdetMap.keys.toList()..sort();

              double tekilHacim(int capCm) {
                final r = (capCm / 100.0) / 2.0;
                return pi * r * r * emvalBoyuM;
              }

              int toplamAdet = 0;
              double toplamHacim = 0.0;
              int inceAdet = 0, ortaAdet = 0, kalinAdet = 0;
              double inceHacim = 0, ortaHacim = 0, kalinHacim = 0;

              final List<List<String>> tabloSatirlari = [];
              for (final cap in sortedCaplar) {
                final adet = capAdetMap[cap]!;
                final tekil = tekilHacim(cap);
                final satirToplam = tekil * adet;
                toplamAdet += adet;
                toplamHacim += satirToplam;

                if (cap < 20) {
                  inceAdet += adet;
                  inceHacim += satirToplam;
                } else if (cap < 30) {
                  ortaAdet += adet;
                  ortaHacim += satirToplam;
                } else {
                  kalinAdet += adet;
                  kalinHacim += satirToplam;
                }

                tabloSatirlari.add([
                  '$cap cm',
                  '$adet',
                  tekil.toStringAsFixed(4),
                  satirToplam.toStringAsFixed(3),
                ]);
              }

              final now = DateTime.now();
              final tarihStr =
                  '${now.day.toString().padLeft(2, '0')}.${now.month.toString().padLeft(2, '0')}.${now.year} '
                  '${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}';

              final doc = pw.Document(
                theme: pw.ThemeData.withFont(base: regularFont, bold: boldFont),
              );

              doc.addPage(
                pw.MultiPage(
                  pageFormat: PdfPageFormat.a4,
                  margin: const pw.EdgeInsets.all(28),
                  build: (context) => [
                    pw.Header(
                      level: 0,
                      child: pw.Row(
                        mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                        children: [
                          pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.start,
                            children: [
                              pw.Text(
                                'TomrukOlcumAI - Emval Çap ve Hacim Dökümü',
                                style: pw.TextStyle(fontSize: 16, fontWeight: pw.FontWeight.bold),
                              ),
                              pw.Text(
                                'Geliştirici: CİHAN TÜRKMEN | Denizli Orman Bölge Müdürlüğü',
                                style: const pw.TextStyle(fontSize: 9, color: PdfColors.grey700),
                              ),
                            ],
                          ),
                          pw.Text(tarihStr, style: const pw.TextStyle(fontSize: 10)),
                        ],
                      ),
                    ),
                    pw.SizedBox(height: 8),
                    pw.Container(
                      padding: const pw.EdgeInsets.all(10),
                      decoration: pw.BoxDecoration(
                        color: PdfColors.grey100,
                        border: pw.Border.all(color: PdfColors.grey400),
                        borderRadius: const pw.BorderRadius.all(pw.Radius.circular(4)),
                      ),
                      child: pw.Row(
                        mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                        children: [
                          pw.Text('Emval Boyu: ${emvalBoyuM.toStringAsFixed(2)} m (Kabuksuz)'),
                          pw.Text('Ölçülen Kare/Parça: $parcaSayisi'),
                          pw.Text(
                            'Toplam: $toplamAdet Adet | ${toplamHacim.toStringAsFixed(3)} m³',
                            style: pw.TextStyle(fontWeight: pw.FontWeight.bold),
                          ),
                        ],
                      ),
                    ),
                    pw.SizedBox(height: 14),
                    pw.TableHelper.fromTextArray(
                      headers: const ['Çap (cm)', 'Adet', 'Tekil Hacim (m³)', 'Toplam Hacim (m³)'],
                      data: [
                        ...tabloSatirlari,
                        ['GENEL TOPLAM', '$toplamAdet', '-', toplamHacim.toStringAsFixed(3)],
                      ],
                      headerStyle: pw.TextStyle(fontWeight: pw.FontWeight.bold, color: PdfColors.white),
                      headerDecoration: const pw.BoxDecoration(color: PdfColor.fromInt(0xFF2E5A27)),
                      cellAlignment: pw.Alignment.center,
                      cellPadding: const pw.EdgeInsets.symmetric(vertical: 5, horizontal: 8),
                    ),
                    pw.SizedBox(height: 16),
                    pw.Text(
                      'Çap Sınıfı Dağılımı',
                      style: pw.TextStyle(fontSize: 12, fontWeight: pw.FontWeight.bold),
                    ),
                    pw.SizedBox(height: 6),
                    pw.TableHelper.fromTextArray(
                      headers: const ['Sınıf', 'Adet', 'Toplam Hacim (m³)'],
                      data: [
                        ['İnce (< 20 cm)', '$inceAdet', inceHacim.toStringAsFixed(3)],
                        ['Orta (20 - 29 cm)', '$ortaAdet', ortaHacim.toStringAsFixed(3)],
                        ['Kalın (30+ cm)', '$kalinAdet', kalinHacim.toStringAsFixed(3)],
                      ],
                      headerStyle: pw.TextStyle(fontWeight: pw.FontWeight.bold),
                      headerDecoration: const pw.BoxDecoration(color: PdfColors.grey200),
                      cellAlignment: pw.Alignment.center,
                    ),
                    pw.SizedBox(height: 12),
                    pw.Text(
                      'Not: Tüm ondalık çaplar standart gereği tam sayıya aşağı yuvarlanarak (floor) kabuksuz silindirik net hacim hesaplanmıştır.',
                      style: const pw.TextStyle(fontSize: 8, color: PdfColors.grey600),
                    ),
                  ],
                ),
              );

              final bytes = await doc.save();
              await Printing.sharePdf(
                bytes: bytes,
                filename: 'TomrukOlcumAI_Dokum_${now.year}${now.month}${now.day}_${now.hour}${now.minute}.pdf',
              );
            }
          }

          class TomrukOlcumApp extends StatelessWidget {
            const TomrukOlcumApp({super.key});

