          class _OlcumOverlayPainter extends CustomPainter {
            final Offset? refP1;
            final Offset? refP2;
            final List<TespitEdilenTomruk> tomruklar;
            final int? seciliIdx;

            _OlcumOverlayPainter({
              required this.refP1,
              required this.refP2,
              required this.tomruklar,
              required this.seciliIdx,
            });

            @override
            void paint(Canvas canvas, Size size) {
              final refPaint = Paint()
                ..color = Colors.amber
                ..strokeWidth = 2.5
                ..style = PaintingStyle.stroke;

              if (refP1 != null) {
                final p1 = Offset(refP1!.dx * size.width, refP1!.dy * size.height);
                canvas.drawCircle(p1, 5, Paint()..color = Colors.amber);
                if (refP2 != null) {
                  final p2 = Offset(refP2!.dx * size.width, refP2!.dy * size.height);
                  canvas.drawCircle(p2, 5, Paint()..color = Colors.amber);
                  canvas.drawLine(p1, p2, refPaint);
                }
              }

              for (int i = 0; i < tomruklar.length; i++) {
                final t = tomruklar[i];
                final isSelected = i == seciliIdx;
                final logPaint = Paint()
                  ..color = isSelected ? Colors.cyanAccent : Colors.lightGreenAccent
                  ..strokeWidth = isSelected ? 3.0 : 1.8
                  ..style = PaintingStyle.stroke;

                final center = Offset(t.xNorm * size.width, t.yNorm * size.height);
                final radius = max(3.0, (t.capNorm * size.width) / 2.0);
                canvas.drawCircle(center, radius, logPaint);

                final tp = TextPainter(
                  text: TextSpan(
                    text: '${t.capCm.round()}',
                    style: TextStyle(
                      color: isSelected ? Colors.black : Colors.white,
                      fontSize: 9,
                      fontWeight: FontWeight.bold,
                      backgroundColor: isSelected ? Colors.cyanAccent : Colors.black54,
                    ),
                  ),
                  textDirection: TextDirection.ltr,
                )..layout();
                tp.paint(canvas, center - Offset(tp.width / 2, tp.height / 2));
              }
            }

            @override
            bool shouldRepaint(covariant _OlcumOverlayPainter oldDelegate) => true;
          }
          EOF

          cat << 'EOF' > mobile_app/test/widget_test.dart
          import 'package:flutter_test/flutter_test.dart';
          import 'package:tomruk_olcum_ai/main.dart';

          void main() {
            testWidgets('KameraOlcumSayfasi acilis testi', (WidgetTester tester) async {
              await tester.pumpWidget(const TomrukOlcumApp());
              expect(find.text('TomrukOlcumAI - Kamera'), findsOneWidget);
            });
          }
          EOF

      - name: Güncel Kodu Depoya Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile_app
          git diff --staged --quiet || git commit -m "feat: kesin sifir cakisma (teget siniri) ve en-boy orani korumasi eklendi"
          git push

      - name: Test Et ve APK Üret
        working-directory: mobile_app
        run: |
          if [ -f android/build.gradle.kts ]; then
            grep -q "lintVital" android/build.gradle.kts || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            grep -q "lintVital" android/build.gradle || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle
          fi
          flutter pub get
          flutter test
          flutter build apk --release

      - name: APK Çıktısını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tomruk-olcum-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
