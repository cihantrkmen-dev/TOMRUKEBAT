name: TomrukOlcumAI CI/CD & APK Oluştur

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-release-apk:
    name: Flutter Uygulamasını Oluştur ve APK Derle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Java (JDK 17) Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Başlangıç Flutter Projesini Oluştur (Yoksa)
        run: |
          if [ ! -f mobile_app/pubspec.yaml ]; then
            flutter create --org com.tomruk --project-name tomruk_olcum_ai mobile_app

            cat << 'EOF' > mobile_app/lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';

          void main() {
            runApp(const TomrukOlcumApp());
          }

          class TomrukOlcumApp extends StatelessWidget {
            const TomrukOlcumApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'TomrukOlcumAI',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF2E5A27)),
                  useMaterial3: true,
                ),
                home: const AnaSayfa(),
              );
            }
          }

          class AnaSayfa extends StatefulWidget {
            const AnaSayfa({super.key});

            @override
            State<AnaSayfa> createState() => _AnaSayfaState();
          }

          class _AnaSayfaState extends State<AnaSayfa> {
            final Map<String, double> _kabukOranlari = const {
              'Kızılçam': 12.0,
              'Karaçam': 11.0,
              'Sedir': 10.0,
              'Kayın': 5.0,
              'Meşe': 9.0,
              'Diğer (0%)': 0.0,
            };

            String _seciliTur = 'Kızılçam';
            double _tomrukBoyu = 3.0;
            final List<double> _caplarCm = [18, 22, 26, 31, 34];
            final TextEditingController _capController = TextEditingController();

            double get _kabukOrani => _kabukOranlari[_seciliTur] ?? 0.0;

            double _hacimHesapla(double capCm, {required bool kabuksuz}) {
              final double rMetre = (capCm / 100.0) / 2.0;
              final double brut = pi * rMetre * rMetre * _tomrukBoyu;
              return kabuksuz ? brut * (1.0 - _kabukOrani / 100.0) : brut;
            }

            void _capEkle() {
              final val = double.tryParse(_capController.text.replaceAll(',', '.'));
              if (val != null && val >= 6 && val <= 150) {
                setState(() {
                  _caplarCm.add(val);
                  _capController.clear();
                });
              }
            }

            @override
            void dispose() {
              _capController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final double brutToplam = _caplarCm.fold(
                0.0,
                (sum, d) => sum + _hacimHesapla(d, kabuksuz: false),
              );
              final double netToplam = _caplarCm.fold(
                0.0,
                (sum, d) => sum + _hacimHesapla(d, kabuksuz: true),
              );
              final int inceAdet = _caplarCm.where((d) => d < 20).length;
              final int ortaAdet = _caplarCm.where((d) => d >= 20 && d < 30).length;
              final int kalinAdet = _caplarCm.where((d) => d >= 30).length;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('TomrukOlcumAI (MVP)'),
                  backgroundColor: Theme.of(context).colorScheme.primaryContainer,
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text(
                              'Ölçüm Parametreleri',
                              style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                            ),
                            const SizedBox(height: 12),
                            DropdownButtonFormField<String>(
                              value: _seciliTur,
                              decoration: const InputDecoration(
                                labelText: 'Ağaç Türü (Kabuk Düşümü)',
                                border: OutlineInputBorder(),
                              ),
                              items: _kabukOranlari.entries
                                  .map(
                                    (e) => DropdownMenuItem(
                                      value: e.key,
                                      child: Text('${e.key} (%${e.value.toStringAsFixed(0)})'),
                                    ),
                                  )
                                  .toList(),
                              onChanged: (v) {
                                if (v != null) setState(() => _seciliTur = v);
                              },
                            ),
                            const SizedBox(height: 12),
                            DropdownButtonFormField<double>(
                              value: _tomrukBoyu,
                              decoration: const InputDecoration(
                                labelText: 'Tomruk Boyu (m)',
                                border: OutlineInputBorder(),
                              ),
                              items: const [2.0, 2.5, 3.0, 4.0, 5.0]
                                  .map(
                                    (b) => DropdownMenuItem(
                                      value: b,
                                      child: Text('${b.toStringAsFixed(1)} m'),
                                    ),
                                  )
                                  .toList(),
                              onChanged: (v) {
                                if (v != null) setState(() => _tomrukBoyu = v);
                              },
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text(
                              'Özet Sonuçlar',
                              style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                            ),
                            const SizedBox(height: 8),
                            Text('Toplam Adet: ${_caplarCm.length}'),
                            Text('Kabuklu Hacim: ${brutToplam.toStringAsFixed(3)} m³'),
                            Text(
                              'Kabuksuz Net Hacim: ${netToplam.toStringAsFixed(3)} m³',
                              style: const TextStyle(fontWeight: FontWeight.bold),
                            ),
                            const Divider(height: 20),
                            Text('İnce (<20 cm): $inceAdet | Orta (20-29 cm): $ortaAdet | Kalın (30+ cm): $kalinAdet'),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    Row(
                      children: [
                        Expanded(
                          child: TextField(
                            controller: _capController,
                            keyboardType: const TextInputType.numberWithOptions(decimal: true),
                            decoration: const InputDecoration(
                              labelText: 'Test Çapı Ekle (cm)',
                              border: OutlineInputBorder(),
                            ),
                          ),
                        ),
                        const SizedBox(width: 8),
                        FilledButton(
                          onPressed: _capEkle,
                          child: const Text('Ekle'),
                        ),
                      ],
                    ),
                    const SizedBox(height: 12),
                    Wrap(
                      spacing: 8,
                      children: List.generate(
                        _caplarCm.length,
                        (i) => Chip(
                          label: Text('${_caplarCm[i].toStringAsFixed(0)} cm'),
                          onDeleted: () => setState(() => _caplarCm.removeAt(i)),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

            cat << 'EOF' > mobile_app/test/widget_test.dart
          import 'package:flutter_test/flutter_test.dart';
          import 'package:tomruk_olcum_ai/main.dart';

          void main() {
            testWidgets('TomrukOlcumApp acilis testi', (WidgetTester tester) async {
              await tester.pumpWidget(const TomrukOlcumApp());
              expect(find.text('TomrukOlcumAI (MVP)'), findsOneWidget);
            });
          }
          EOF

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mobile_app
            git diff --staged --quiet || git commit -m "feat: TomrukOlcumAI başlangıç Flutter uygulaması oluşturuldu"
            git push
          fi

      - name: Bağımlılıkları Al, Test Et ve APK Üret
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release

      - name: APK Çıktısını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tomruk-olcum-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
