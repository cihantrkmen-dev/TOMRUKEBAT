      - name: Güncel Kodu Depoya Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile_app
          git diff --staged --quiet || git commit -m "feat: otomatik dilimleme, 1-5 referans IDW, parcali istif ve PDF dokumu eklendi"
          git push

      - name: R8/ProGuard Aktifle, Test Et ve APK Üret
        working-directory: mobile_app
        run: |
          mkdir -p android/app
          grep -q "org.tensorflow.lite" android/app/proguard-rules.pro 2>/dev/null || printf '\n-keep class org.tensorflow.lite.** { *; }\n-dontwarn org.tensorflow.lite.**\n' >> android/app/proguard-rules.pro

          if [ -f android/build.gradle.kts ]; then
            grep -q "lintVital" android/build.gradle.kts || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            grep -q "lintVital" android/build.gradle || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' android/app/build.gradle
          fi

          flutter pub get
          flutter test
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: APK Çıktısını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tomruk-olcum-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
