# ==============================================================================
# TomrukOlcumAI - GitHub Actions Tek Seferde Yüklenebilir Otomasyon & CI/CD
# ==============================================================================
# Kurulum: Bu dosyayı GitHub deponuzda şu yola yükleyin:
#   .github/workflows/tomruk-olcum-ci.yml
#
# Özellikler:
# 1. Manuel tetikleme (workflow_dispatch) ile boş repoda proje klasör yapısını
#    ve tomruk_olcum_projesi.yaml dosyasını tek tıkla otomatik oluşturur.
# 2. Her push ve pull_request işleminde YAML yapılandırmasını doğrular.
# 3. Python (OpenCV / ArUco / YOLO) ve Flutter (Android APK) hatlarını çalıştırır.
# ==============================================================================

name: TomrukOlcumAI CI/CD & Kurulum

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      scaffold_project:
        description: "Boş repoda proje klasör yapısını ve ana YAML konfigürasyonunu otomatik oluştur"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. TEK TIKLA PROJE İSKELETİ OLUŞTURMA (Sadece manuel tetiklendiğinde çalışır)
  # ----------------------------------------------------------------------------
  scaffold-repository:
    name: Proje İskeletini Oluştur
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.scaffold_project == true
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Klasör Yapısını ve Ana Konfigürasyonu Oluştur
        run: |
          mkdir -p config ai_pipeline/models ai_pipeline/scripts mobile_app docs

          if [ ! -f config/tomruk_olcum_projesi.yaml ]; then
          cat << 'EOF' > config/tomruk_olcum_projesi.yaml
          project:
            name: "TomrukOlcumAI"
            version: "0.1.0-mvp"
            description: "Akıllı telefon kamerası ile istiflerdeki tomrukların adet, çap ve hacim (m3) hesabını yapan mobil uygulama."
            target_platforms:
              - "Android"
              - "iOS"
            framework: "Flutter"
            architecture_mode: "offline_first"

          calibration:
            primary_method: "aruco_marker"
            fallback_method: "manual_reference_bar"
            aruco_config:
              dictionary: "DICT_4X4_50"
              marker_id: 0
              physical_size_cm: 50.0
              require_same_plane: true
            manual_bar_config:
              default_length_cm: 100.0
            perspective_control:
              enabled: true
              max_tilt_angle_deg: 10.0
              max_yaw_angle_deg: 10.0
              live_camera_guidance: true
              auto_perspective_warp: true

          ai_vision_pipeline:
            execution_mode: "on_device"
            inference_engine: "TFLite"
            cloud_fallback_enabled: false
            preprocessing:
              auto_white_balance: true
              shadow_compensation:
                method: "CLAHE"
                clip_limit: 2.0
                tile_grid_size: [8, 8]
              target_resolution: [1280, 1280]
            object_detection:
              model_architecture: "YOLOv11-seg"
              target_class: "log_end"
              confidence_threshold: 0.45
              iou_threshold: 0.50
              max_detections_per_frame: 500
            diameter_extraction:
              method: "min_enclosing_ellipse"
              min_valid_diameter_cm: 6.0
              max_valid_diameter_cm: 150.0

          human_in_the_loop:
            interactive_review_screen: true
            allowed_actions:
              - "zoom_and_pan"
              - "add_missing_log"
              - "remove_false_positive"
              - "resize_diameter"
            active_learning:
              save_corrections_for_retraining: true
              anonymize_metadata: false

          multi_frame_stack:
            enabled: true
            overlap_prevention_method: "boundary_log_tagging"
            merge_into_single_report: true

          forestry_calculations:
            volume_formula: "huber_cylinder"
            default_log_lengths_m: [2.0, 2.5, 3.0, 4.0, 5.0]
            allow_custom_length: true
            bark_deduction:
              enabled: true
              mode: "species_default_percentage"
              species_presets:
                kizilcam: { label: "Kızılçam", deduction_percent: 12.0 }
                karacam:  { label: "Karaçam",  deduction_percent: 11.0 }
                sedir:    { label: "Sedir",    deduction_percent: 10.0 }
                kayin:    { label: "Kayın",    deduction_percent: 5.0 }
                mese:     { label: "Meşe",     deduction_percent: 9.0 }
                diger:    { label: "Diğer / Manuel", deduction_percent: 0.0 }
            diameter_classes_cm:
              - { name: "Ince Cap",  min_cm: 10.0, max_cm: 19.9 }
              - { name: "Orta Cap",  min_cm: 20.0, max_cm: 29.9 }
              - { name: "Kalin Cap", min_cm: 30.0, max_cm: 150.0 }

          data_and_storage:
            local_database: "SQLite"
            auto_sync_on_wifi_or_cellular: true
            record_metadata:
              - "measurement_id"
              - "timestamp"
              - "gps_coordinates"
              - "depo_adi"
              - "istif_no"
              - "parti_no"
              - "agac_turu"
              - "tomruk_boyu_m"
              - "olcum_yapan"

          reporting:
            export_formats: ["PDF", "XLSX", "CSV", "JSON"]
            include_in_report:
              - "annotated_image"
              - "total_log_count"
              - "average_diameter_cm"
              - "diameter_class_breakdown"
              - "gross_volume_m3"
              - "net_volume_m3"
          EOF
          sed -i 's/^          //' config/tomruk_olcum_projesi.yaml
          fi

          touch ai_pipeline/models/.gitkeep ai_pipeline/scripts/.gitkeep mobile_app/.gitkeep docs/.gitkeep

      - name: Oluşturulan Dosyaları Depoya Kaydet (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: TomrukOlcumAI proje iskeleti ve ana YAML konfigürasyonu oluşturuldu"
          git push

  # ----------------------------------------------------------------------------
  # 2. YAML KONFİGÜRASYON DOĞRULAMA
  # ----------------------------------------------------------------------------
  validate-config:
    name: YAML Konfigürasyon Doğrulama
    runs-on: ubuntu-latest
    needs: [ scaffold-repository ]
    if: always() && (needs.scaffold-repository.result == 'success' || needs.scaffold-repository.result == 'skipped')
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PyYAML Kur ve Konfigürasyonu Kontrol Et
        run: |
          pip install pyyaml
          python - << 'PYEOF'
          import os, sys, yaml

          candidates = ['config/tomruk_olcum_projesi.yaml', 'tomruk_olcum_projesi.yaml']
          target = next((p for p in candidates if os.path.exists(p)), None)
          if not target:
              print('Uyarı: tomruk_olcum_projesi.yaml bulunamadı. Önce scaffold_project ile oluşturabilirsiniz.')
              sys.exit(0)

          with open(target, 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)

          required_sections = [
              'project', 'calibration', 'ai_vision_pipeline',
              'human_in_the_loop', 'forestry_calculations',
              'data_and_storage', 'reporting'
          ]
          missing = [k for k in required_sections if k not in data]
          if missing:
              print(f'Hata: Eksik ana bölümler: {missing}')
              sys.exit(1)

          print(f'Başarılı: {target} geçerli. Proje: {data["project"]["name"]} v{data["project"]["version"]}')
          PYEOF

  # ----------------------------------------------------------------------------
  # 3. YAPAY ZEKA GÖRÜNTÜ İŞLEME HATTI TESTLERİ (Python / OpenCV / YOLO)
  # ----------------------------------------------------------------------------
  ai-pipeline-tests:
    name: AI Görüntü İşleme Testleri
    runs-on: ubuntu-latest
    needs: [ validate-config ]
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları Yükle ve Testleri Çalıştır
        run: |
          if [ -f ai_pipeline/requirements.txt ]; then
            pip install -r ai_pipeline/requirements.txt
          fi
          if [ -d ai_pipeline/tests ]; then
            pip install pytest
            pytest ai_pipeline/tests
          else
            echo "ai_pipeline/tests klasörü henüz eklenmemiş, adım atlanıyor."
          fi

  # ----------------------------------------------------------------------------
  # 4. FLUTTER MOBİL UYGULAMA DERLEME VE TEST (Android APK)
  # ----------------------------------------------------------------------------
  flutter-mobile-build:
    name: Flutter Android Derleme & Test
    runs-on: ubuntu-latest
    needs: [ validate-config ]
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Flutter Projesi Kontrolü
        id: check_flutter
        run: |
          if [ -f mobile_app/pubspec.yaml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "mobile_app/pubspec.yaml henüz yok, derleme adımı atlanıyor."
          fi

      - name: Java (JDK 17) Kurulumu
        if: steps.check_flutter.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Flutter Kurulumu
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bağımlılıkları Al, Test Et ve APK Üret
        if: steps.check_flutter.outputs.exists == 'true'
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release

      - name: APK Çıktısını Yükle (Artifact)
        if: steps.check_flutter.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tomruk-olcum-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
