          class _OlcumOverlayPainter extends CustomPainter {
            final Offset? ref1P1;
            final Offset? ref1Center;
            final double? ref1CapNorm;
            final double ref1CapCm;
            final bool ref1Secili;
            final Offset? ref2P1;
            final Offset? ref2Center;
            final double? ref2CapNorm;
            final double ref2CapCm;
            final bool ref2Secili;
            final Offset? roiP1;
            final Rect? roiNorm;
            final List<TespitEdilenTomruk> tomruklar;
            final int? seciliIdx;

            _OlcumOverlayPainter({
              required this.ref1P1,
              required this.ref1Center,
              required this.ref1CapNorm,
              required this.ref1CapCm,
              required this.ref1Secili,
              required this.ref2P1,
              required this.ref2Center,
              required this.ref2CapNorm,
              required this.ref2CapCm,
              required this.ref2Secili,
              required this.roiP1,
              required this.roiNorm,
              required this.tomruklar,
              required this.seciliIdx,
            });

            void _cizReferans(
              Canvas canvas,
              Size size,
              Offset? p1,
              Offset? centerNorm,
              double? capNorm,
              double capCm,
              Color renk,
              String etiket,
              bool secili,
            ) {
              if (centerNorm != null && capNorm != null) {
                final c = Offset(centerNorm.dx * size.width, centerNorm.dy * size.height);
                final r = max(4.0, (capNorm * size.width) / 2.0);
                canvas.drawCircle(
                  c,
                  r,
                  Paint()
                    ..color = renk
                    ..strokeWidth = secili ? 3.5 : 2.5
                    ..style = PaintingStyle.stroke,
                );
                final tp = TextPainter(
                  text: TextSpan(
                    text: '$etiket ${capCm.floor()}',
                    style: TextStyle(
                      color: Colors.white,
                      fontSize: 9,
                      fontWeight: FontWeight.bold,
                      backgroundColor: renk,
                    ),
                  ),
                  textDirection: TextDirection.ltr,
                )..layout();
                tp.paint(canvas, c - Offset(tp.width / 2, tp.height / 2));
              } else if (p1 != null) {
                canvas.drawCircle(
                  Offset(p1.dx * size.width, p1.dy * size.height),
                  5,
                  Paint()..color = renk,
                );
              }
            }

            @override
            void paint(Canvas canvas, Size size) {
              if (roiNorm != null) {
                final rect = Rect.fromLTRB(
                  roiNorm!.left * size.width,
                  roiNorm!.top * size.height,
                  roiNorm!.right * size.width,
                  roiNorm!.bottom * size.height,
                );
                canvas.drawRect(
                  rect,
                  Paint()
                    ..color = Colors.lightBlueAccent
                    ..strokeWidth = 2.0
                    ..style = PaintingStyle.stroke,
                );
              } else if (roiP1 != null) {
                canvas.drawCircle(
                  Offset(roiP1!.dx * size.width, roiP1!.dy * size.height),
                  5,
                  Paint()..color = Colors.lightBlueAccent,
                );
              }

              _cizReferans(canvas, size, ref1P1, ref1Center, ref1CapNorm, ref1CapCm, Colors.redAccent, 'R1', ref1Secili);
              _cizReferans(canvas, size, ref2P1, ref2Center, ref2CapNorm, ref2CapCm, Colors.orange, 'R2', ref2Secili);

              for (int i = 0; i < tomruklar.length; i++) {
                final t = tomruklar[i];
                final isSelected = i == seciliIdx;
                final center = Offset(t.xNorm * size.width, t.yNorm * size.height);
                final radius = max(3.0, (t.capNorm * size.width) / 2.0);
                canvas.drawCircle(
                  center,
                  radius,
                  Paint()
                    ..color = isSelected ? Colors.cyanAccent : Colors.lightGreenAccent
                    ..strokeWidth = isSelected ? 3.0 : 1.8
                    ..style = PaintingStyle.stroke,
                );

                final tp = TextPainter(
                  text: TextSpan(
                    text: '${t.capCm.floor()}',
                    style: TextStyle(
                      color: isSelected ? Colors.black : Colors.white,
                      fontSize: 9,
                      fontWeight: FontWeight.bold,
                      backgroundColor: isSelected ? Colors.cyanAccent : Colors.black54,
                    ),
                  ),
                  textDirection: TextDirection.ltr,
                )..layout();
                tp.paint(canvas, center - Offset(tp.width / 2, tp.height / 2));
              }
            }

            @override
            bool shouldRepaint(covariant _OlcumOverlayPainter oldDelegate) => true;
          }
          EOF

          cat << 'EOF' > mobile_app/test/widget_test.dart
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:tomruk_olcum_ai/main.dart';

          void main() {
            testWidgets('AcilisEkrani ve LisansServisi testi', (WidgetTester tester) async {
              SharedPreferences.setMockInitialValues({});
              expect(LisansServisi.yoneticiSifresiDogrula('Cihan2026!'), isTrue);
              expect(LisansServisi.yoneticiSifresiDogrula('yanlis'), isFalse);

              final anahtar = LisansServisi.lisansAnahtariUret('TALEP-TEST');
              expect(anahtar.startsWith('OGM-'), isTrue);

              await tester.pumpWidget(const TomrukOlcumApp());
              expect(find.text('Geliştirici CİHAN TÜRKMEN'), findsOneWidget);
              await tester.pumpAndSettle(const Duration(seconds: 3));
            });
          }
          EOF

      - name: Güncel Kodu Depoya Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile_app
          git diff --staged --quiet || git commit -m "feat: YOLO-TFLite yapay zeka motoru ve yedek tespit sistemi eklendi"
          git push

      - name: R8/ProGuard Aktifle, Test Et ve APK Üret
        working-directory: mobile_app
        run: |
          # TFLite JNI sınıflarını R8/ProGuard'dan koru
          mkdir -p android/app
          grep -q "org.tensorflow.lite" android/app/proguard-rules.pro 2>/dev/null || printf '\n-keep class org.tensorflow.lite.** { *; }\n-dontwarn org.tensorflow.lite.**\n' >> android/app/proguard-rules.pro

          if [ -f android/build.gradle.kts ]; then
            grep -q "lintVital" android/build.gradle.kts || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            grep -q "lintVital" android/build.gradle || printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.contains("lintVital")) {\n            enabled = false\n        }\n    }\n}\n' >> android/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minifyEnabled false/minifyEnabled true/g' android/app/build.gradle
          fi

          flutter pub get
          flutter test
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: APK Çıktısını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tomruk-olcum-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
